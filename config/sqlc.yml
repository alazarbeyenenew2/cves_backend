version: "2"

sql:
  - schema: "../internal/constant/db/schemas"
    queries: "../internal/constant/db/queries"
    engine: "postgresql"
    
    gen:
      go:
        package: "generated"
        out: "../internal/constant/db/generated"
        sql_package: "pgx/v4"  
        emit_json_tags: true 
        emit_interface: true 
        emit_empty_slices: true 
        emit_pointers_for_null_types: true  
        
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: true
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: false